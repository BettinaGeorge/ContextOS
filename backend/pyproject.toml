[project]
name = "contextos-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.117.0",
    "asyncpg>=0.31.0",
    "cryptography>=49.0.0",
    "fastapi>=0.139.2",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "notion-client>=3.1.0",
    "pgvector>=0.5.0",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.51.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-in-default-argument is the framework's documented
# dependency-injection idiom, not the footgun this rule normally guards against.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; not worth hand-editing generated migration code.
"alembic/versions/*.py" = ["E501", "UP007", "UP006", "UP035", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests share one event loop (session scope) rather than pytest-asyncio's
# default per-test loop, because the SQLAlchemy async engine's connection
# pool is a single module-level object — asyncpg connections created in one
# event loop can't be closed from a different one.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
